name: validation
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - run: apt-get update && apt-get install -y python3 python3-venv git curl ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install hash-pinned validation dependency
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes --only-binary=:all: -r requirements.txt
      - name: Install checksum-pinned Gitleaks 8.24.3
        run: bash tools/install_gitleaks.sh /usr/local/bin
      - name: Reject credentials in tracked Git history
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gitleaks git --redact --no-banner --config .gitleaks.toml --log-opts="--all" .
      # Validate all courses, including changed courses and shared-schema dependants.
      - name: Schemas, provenance, licences, media, registry and Swift validator
        run: .venv/bin/python tools/validate.py
      - name: Regression tests
        run: .venv/bin/python -m unittest discover -s tests -v
      - name: DCO and changelog policy
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          .venv/bin/python tools/check_dco.py "$BASE_SHA" "$HEAD_SHA"
          .venv/bin/python tools/check_changelog.py "$BASE_SHA" "$HEAD_SHA"
